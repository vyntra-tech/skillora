<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Skillora Favicon (Gradient S Icon) -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='sGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%236D5DFB'/%3E%3Cstop offset='100%25' stop-color='%238B5CF6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23sGrad)'/%3E%3Cpath d='M21.5 11c-.5-1.8-2.2-3-4.5-3-2.8 0-4.8 1.6-4.8 3.8 0 2.2 1.8 3.1 4 3.7l1.2.3c2 .5 3.1 1.2 3.1 2.7 0 1.8-1.7 3-4.2 3-2.6 0-4.5-1.3-4.9-3.2m-1.4 0h2.8m8.6-7.3h-2.8' stroke='%23ffffff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
  <title>Skillora — Discover Jobs, Internships & Career Opportunities</title>
  <meta name="description"
    content="Skillora helps you discover jobs, internships, companies and career resources to build your future." />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Immediate theme initializer to avoid flash -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('skillora-theme');
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body
  class="bg-bg-app text-text-primary antialiased selection:bg-brand-primary selection:text-white transition-colors duration-200">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
